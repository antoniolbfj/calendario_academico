    if(latest){html+='<section class="cal-help-section"><h3>Novidades</h3><div class="cal-help-list">'+cardButton('news',latest.id,'Novidades '+latest.id,latest.title,true)+'</div></section>';}
    if(start.length){html+='<section class="cal-help-section"><h3>Comece por aqui</h3><div class="cal-help-list">'+start.map(function(item){return cardButton('topic',item.id,item.title,'Veja o procedimento, como conferir o resultado e os cuidados importantes.');}).join('')+'</div></section>';}
    html+='<section class="cal-help-section"><h3>Ajuda desta tela</h3>'+(local.length?'<div class="cal-help-list">'+local.map(function(item){return cardButton('topic',item.id,item.title,item.requiresEdit&&!context.canEdit?'Você pode consultar; para executar, é preciso possuir a edição.':'Abra as instruções detalhadas.');}).join('')+'</div>':'<div class="cal-help-empty">Não há outra orientação para esta tela no momento.</div>')+'</section>';
    ui.content.innerHTML=html;ui.content.scrollTop=0;
  }
  function showTopic(id){
    const topic=topicById.get(id);if(!topic)return;view={kind:'topic',id:id};setHeader(topic.category,topic.title,true);let note='';if(topic.requiresEdit&&!context.canEdit)note='<p class="cal-help-role-note">Para executar esta função, você precisa possuir a edição do Projeto. Você ainda pode consultar a orientação e preparar os passos antes de assumir a edição.</p>';ui.content.innerHTML=note+'<article class="cal-help-article">'+topic.html+'</article>';ui.content.scrollTop=0;
  }
  function showNews(id){
    const selected=id?news.find(function(item){return item.id===id;}):null;view={kind:'news',id:id||''};setHeader('Atualizações do sistema',selected?'Novidades '+selected.id:'Novidades',true);const items=selected?[selected]:news;ui.content.innerHTML='<div class="cal-help-news-article">'+items.map(function(item){return '<section class="cal-help-news-version'+(item.id===HELP_MODULE_RELEASE?' current':'')+'"><h3>'+escapeHtml(item.id)+' — '+escapeHtml(item.title)+'</h3><p>'+escapeHtml(item.date||'')+'</p><ul>'+((item.items||[]).map(function(line){return '<li>'+escapeHtml(line)+'</li>';})).join('')+'</ul></section>';}).join('')+'</div>';ui.content.scrollTop=0;writePrefs({lastSeenRelease:HELP_MODULE_RELEASE});updateIndicator(false);
  }
  function handleContentClick(event){const button=event.target.closest('[data-help-kind]');if(!button)return;if(button.dataset.helpKind==='topic')showTopic(button.dataset.helpId);if(button.dataset.helpKind==='news')showNews(button.dataset.helpId);}

  function closeOtherTooltips(except){document.querySelectorAll('.cal-help-tooltip-wrap[data-open="true"]').forEach(function(wrap){if(wrap===except)return;wrap.dataset.open='false';const tip=wrap._calHelpTooltip;const trigger=wrap.querySelector('.cal-help-tooltip-trigger');if(tip)tip.setAttribute('aria-hidden','true');if(trigger)trigger.setAttribute('aria-expanded','false');});}
  function positionTooltip(trigger,tip){if(!trigger||!tip||tip.getAttribute('aria-hidden')==='true')return;const margin=12,gap=8,rect=trigger.getBoundingClientRect();tip.style.width=Math.min(310,Math.max(180,window.innerWidth-margin*2))+'px';const width=tip.offsetWidth||Math.min(310,window.innerWidth-margin*2),height=tip.offsetHeight||90;let left=rect.left+(rect.width-width)/2;left=Math.max(margin,Math.min(left,window.innerWidth-width-margin));const below=window.innerHeight-rect.bottom-gap,above=rect.top-gap;let top=(below>=height||below>=above)?rect.bottom+gap:rect.top-height-gap;top=Math.max(margin,Math.min(top,window.innerHeight-height-margin));tip.style.left=Math.round(left)+'px';tip.style.top=Math.round(top)+'px';tip.dataset.placement=top<rect.top?'above':'below';}
  function repositionOpenTooltips(){document.querySelectorAll('.cal-help-tooltip-wrap[data-open="true"]').forEach(function(wrap){positionTooltip(wrap.querySelector('.cal-help-tooltip-trigger'),wrap._calHelpTooltip);});}
  function installSettingTooltips(){
    let installedAny=false;
    settingsTooltips.forEach(function(config){
      const title=document.getElementById(config.titleId);if(!title||title.dataset.calHelpTooltipInstalled==='true')return;
      const parent=title.parentElement;if(!parent)return;
      const row=document.createElement('div');row.className='cal-help-title-help-wrap';parent.insertBefore(row,title);row.appendChild(title);
      const wrap=document.createElement('span');wrap.className='cal-help-tooltip-wrap';wrap.dataset.open='false';
      const trigger=document.createElement('button');trigger.type='button';trigger.className='cal-help-tooltip-trigger';trigger.textContent='!';trigger.setAttribute('aria-label','Sobre esta tela: '+config.label);trigger.setAttribute('aria-expanded','false');
      const tip=document.createElement('span');tip.className='cal-help-tooltip';tip.id='calHelpTooltip_'+config.titleId;tip.setAttribute('role','tooltip');tip.setAttribute('aria-hidden','true');tip.innerHTML='<strong>'+escapeHtml(config.label)+'</strong>'+escapeHtml(config.text);
      trigger.setAttribute('aria-describedby',tip.id);wrap.append(trigger);row.appendChild(wrap);document.body.appendChild(tip);wrap._calHelpTooltip=tip;title.dataset.calHelpTooltipInstalled='true';
      function setOpen(open){closeOtherTooltips(open?wrap:null);wrap.dataset.open=open?'true':'false';tip.setAttribute('aria-hidden',open?'false':'true');trigger.setAttribute('aria-expanded',open?'true':'false');if(open)window.requestAnimationFrame(function(){positionTooltip(trigger,tip);});}
      trigger.addEventListener('click',function(event){event.stopPropagation();setOpen(wrap.dataset.open!=='true');});
      trigger.addEventListener('mouseenter',function(){setOpen(true);});wrap.addEventListener('mouseleave',function(){setOpen(false);});trigger.addEventListener('focus',function(){setOpen(true);});trigger.addEventListener('keydown',function(event){if(event.key==='Escape'){setOpen(false);trigger.blur();}});
      installedAny=true;
    });
    if(installedAny&&!tooltipInstalled){tooltipInstalled=true;document.addEventListener('click',function(event){if(!event.target.closest('.cal-help-tooltip-wrap'))closeOtherTooltips(null);});window.addEventListener('resize',repositionOpenTooltips);document.addEventListener('scroll',repositionOpenTooltips,true);}
  }

  function ensureCallout(){
    if(ui.callout)return ui.callout;const node=document.createElement('aside');node.className='cal-help-callout';node.id='calHelpCallout';node.hidden=true;node.setAttribute('role','status');node.setAttribute('aria-live','polite');document.body.appendChild(node);ui.callout=node;return node;
  }
  function positionCallout(){
    const node=ui.callout;if(!node||node.hidden||!ui.button)return;const rect=ui.button.getBoundingClientRect();const margin=12;const width=node.offsetWidth||360;const height=node.offsetHeight||180;const left=Math.max(12,Math.min(window.innerWidth-width-12,rect.right-width));const placeAbove=rect.top>window.innerHeight/2&&rect.top>height+margin;node.dataset.placement=placeAbove?'above':'below';node.style.left=Math.round(left)+'px';node.style.top=Math.round(placeAbove?rect.top-height-margin:rect.bottom+margin)+'px';
  }
  function closeCallout(markReleaseSeen){
    const node=ui.callout;if(!node||node.hidden)return;const checkbox=node.querySelector('[data-help-callout-optout]');if(checkbox&&checkbox.checked)writePrefs({welcomeDismissed:true,lastSeenRelease:HELP_MODULE_RELEASE});else if(markReleaseSeen||node.dataset.kind==='news')writePrefs({lastSeenRelease:HELP_MODULE_RELEASE});calloutAcknowledgedThisPage=true;node.hidden=true;updateIndicator(false);
  }
  function renderCallout(kind){
    const node=ensureCallout();const latest=currentNews();const prefs=readPrefs();
    if(kind==='welcome'){
      node.dataset.kind='welcome';node.innerHTML='<div class="cal-help-callout-head"><div class="cal-help-callout-copy"><span class="cal-help-callout-kicker">Bem-vindo</span><h3>A Ajuda está sempre disponível aqui</h3><p>Use o menu <strong>Ajuda</strong> para encontrar instruções detalhadas da tela que você estiver usando.</p>'+(latest?'<ul>'+((latest.items||[]).slice(0,2).map(function(item){return '<li>'+escapeHtml(item)+'</li>';})).join('')+'</ul>':'')+'</div><button type="button" class="cal-help-callout-close" aria-label="Fechar">×</button></div><div class="cal-help-callout-actions"><label class="cal-help-callout-check"><input type="checkbox" data-help-callout-optout> Não mostrar boas-vindas novamente</label><button type="button" class="cal-help-callout-action">Conhecer a Ajuda</button></div>';
    }else{
      node.dataset.kind='news';node.innerHTML='<div class="cal-help-callout-head"><div class="cal-help-callout-copy"><span class="cal-help-callout-kicker">Novidades</span><h3>'+(latest?escapeHtml(latest.id+' — '+latest.title):'Há novidades no sistema')+'</h3>'+(latest?'<ul>'+((latest.items||[]).slice(0,3).map(function(item){return '<li>'+escapeHtml(item)+'</li>';})).join('')+'</ul>':'<p>Abra a Ajuda para consultar as mudanças desta versão.</p>')+'</div><button type="button" class="cal-help-callout-close" aria-label="Fechar">×</button></div><div class="cal-help-callout-actions"><span></span><button type="button" class="cal-help-callout-action">Ver novidades</button></div>';
    }
    node.querySelector('.cal-help-callout-close').addEventListener('click',function(){closeCallout(true);});
    node.querySelector('.cal-help-callout-action').addEventListener('click',function(){const calloutKind=node.dataset.kind;closeCallout(true);returnFocus=ui.button;showHome();ui.overlay.hidden=false;window.requestAnimationFrame(function(){ui.overlay.classList.add('open');ui.panel.classList.add('open');ui.panel.setAttribute('aria-hidden','false');if(calloutKind==='news'&&latest)showNews(latest.id);ui.close.focus();});});
    node.hidden=false;window.requestAnimationFrame(positionCallout);if(!prefs.lastSeenRelease||prefs.lastSeenRelease!==HELP_MODULE_RELEASE)updateIndicator(true);
  }
  function maybeShowCallout(){
    // R47: boas-vindas/novidades só pertencem à Mesa pronta. Nunca aparecem
    // sobre autenticação, carregamento, escolha de Projeto ou bootstrap intermediário.
    if(calloutShownThisPage||!context.authenticated||!context.workspaceReady||!context.hasCalendar||document.getElementById('emailStep'))return;
    if(detectSurface()!=='WORKSPACE'||!ui.button||!document.body.contains(ui.button))return;
    const loading=document.getElementById('loading'),chooser=document.getElementById('projectChooserModal');if((loading&&!loading.classList.contains('done'))||(chooser&&!chooser.hidden))return;
    const emailNode=document.getElementById('accountMenuEmail');if(emailNode&&String(emailNode.textContent||'').trim()==='E-mail não informado')return;
    const prefs=readPrefs();const kind=!prefs.welcomeDismissed?'welcome':(prefs.lastSeenRelease!==HELP_MODULE_RELEASE?'news':'');if(!kind){updateIndicator(false);return;}calloutShownThisPage=true;renderCallout(kind);
  }

  // Compatibilidade deliberada com o núcleo congelado. R41 não interpreta erros automaticamente.
  function captureAlert(){return null;}
  function captureFeedback(){return null;}
  function codeFromError(){return '';}
  function setContext(next){context=Object.assign({},context,next||{});updateIndicator(false);if(ui.panel&&ui.panel.classList.contains('open')&&view.kind==='home')showHome();window.setTimeout(maybeShowCallout,180);}
  function init(){createUi();window.setTimeout(maybeShowCallout,500);}
  window.CalHelp={init:init,setContext:setContext,captureAlert:captureAlert,captureFeedback:captureFeedback,codeFromError:codeFromError,open:openPanel,close:closePanel,_test:{detectSurface:detectSurface,currentRole:currentRole,prefsKey:prefsKey,hasUnseenNews:hasUnseenNews,settingsTooltips:settingsTooltips.slice(),news:news.slice(),release:HELP_MODULE_RELEASE}};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
