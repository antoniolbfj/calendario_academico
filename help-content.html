      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto ou o contexto administrativo correto antes de aplicar qualquer alteração.<\/p><p>O Tipo de Evento define se <strong>Início<\/strong> e <strong>Término<\/strong> são obrigatórios. Você pode salvar com apenas uma data válida, mas o evento ficará incompleto até receber a outra data exigida.<\/p><p>Use a indicação do formulário para saber o que falta.<\/p><p><strong>Como conferir:<\/strong> use os indicadores e informações da própria tela para confirmar o estado atual. Se houver divergência, atualize a visualização antes de tomar uma decisão.<\/p>"
    },
    {
      "id": "EVE-04",
      "title": "Complete ou altere um evento",
      "category": "Eventos",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> localize o evento correto e confirme que você possui a edição.<\/p><ol><li>Abra o evento existente pela Mesa ou pela lista correspondente.<\/li><li>Confira título, Tipo de Evento e datas antes de alterar qualquer campo, principalmente quando houver eventos com nomes semelhantes.<\/li><li>Faça somente as mudanças necessárias. Se alterar o Tipo de Evento, revise os campos que podem ter se tornado obrigatórios.<\/li><li>Confira se início e término continuam coerentes e se nenhuma informação importante foi removida sem intenção.<\/li><li>Selecione <strong>Salvar<\/strong> e aguarde a confirmação do sistema.<\/li><li>Feche o editor e verifique na Mesa se a mudança aparece no evento correto.<\/li><li>Quando a alteração afetar uma obrigação acadêmica, abra a Checklist/Auditoria para confirmar o novo estado.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> somente o evento escolhido deve refletir a mudança.<\/p>"
    },
    {
      "id": "EVE-05",
      "title": "Exclua um evento",
      "category": "Eventos",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme que você está no Projeto e na versão corretos e que possui a edição quando a tarefa exigir gravação.<\/p><ol><li>Abra o evento correto.<\/li><li>Selecione <strong>Excluir<\/strong>.<\/li><li>Leia a confirmação.<\/li><li>Selecione <strong>Excluir definitivamente<\/strong>.<\/li><\/ol><p>A exclusão é aplicada à base compartilhada e não deve ser usada para recusar uma sugestão.<\/p><p>Antes de confirmar, revise título, Tipo de Evento e datas para garantir que abriu o registro certo. Se o evento participa de uma obrigação da Checklist, a exclusão pode transformar a regra em pendente. Depois de excluir, atualize a Auditoria quando precisar conferir esse impacto.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a confirmação e verifique se o item deixou de estar disponível como esperado antes de repetir a exclusão.<\/p>"
    },
    {
      "id": "TIP-01",
      "title": "Crie um Tipo de Evento",
      "category": "Tipos de evento, semana e feriados",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> abra o Projeto e a versão corretos. Para alterar configurações do Projeto, confirme que você possui a edição.<\/p><ol><li>Abra <strong>Configurações → Tipos de evento<\/strong>.<\/li><li>Selecione a ação para criar um novo tipo e informe um nome claro e um código que não se confunda com os já existentes.<\/li><li>Defina se o tipo será aplicável a calendários <strong>Acadêmicos<\/strong>, <strong>Administrativos<\/strong> ou aos dois.<\/li><li>Configure quais datas serão exigidas e como o evento interfere, quando aplicável, na contagem letiva.<\/li><li>Defina a função visual e demais parâmetros apresentados pela tela.<\/li><li>Se a categoria precisar ser acompanhada pela Checklist deste Projeto, configure a regra correspondente.<\/li><li>Salve e confira se o novo tipo aparece na lista e fica disponível no editor de eventos.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> o tipo deve permanecer cadastrado com as mesmas configurações ao ser reaberto.<\/p>"
    },
    {
      "id": "TIP-02",
      "title": "Escolha os calendários aplicáveis",
      "category": "Tipos de evento, semana e feriados",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme que você está no Projeto e na versão corretos e que possui a edição quando a tarefa exigir gravação.<\/p><p>Em <strong>Tipos de calendário<\/strong>, marque <strong>Acadêmico<\/strong>, <strong>Administrativo<\/strong> ou ambos. O Tipo de Evento aparecerá somente nos calendários compatíveis.<\/p><p>Não remova uma opção que já possua eventos relacionados.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "TIP-03",
      "title": "Defina as datas e o efeito letivo",
      "category": "Tipos de evento, semana e feriados",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme que você está no Projeto e na versão corretos e que possui a edição quando a tarefa exigir gravação.<\/p><p>Marque <strong>Início obrigatório<\/strong> e <strong>Fim obrigatório<\/strong> conforme a regra. Depois escolha como o evento afeta os dias letivos:<\/p><ul><li>não altera a contagem;<\/li><li>este dia não conta como letivo;<\/li><li>este dia passa a contar como letivo.<\/li><\/ul><p>O sistema fará a contagem automaticamente.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "TIP-04",
      "title": "Defina a aparência e a meta",
      "category": "Tipos de evento, semana e feriados",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme que você está no Projeto e na versão corretos e que possui a edição quando a tarefa exigir gravação.<\/p><p>Escolha a função de cor em <strong>Como este tipo aparece no calendário?<\/strong>. O Tema definirá a cor real.<\/p><p>Use <strong>Delimita período letivo<\/strong> para categorias que informam início e término do período. Ative <strong>Possui meta de dias letivos<\/strong> somente quando houver uma quantidade a acompanhar.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "TIP-05",
      "title": "Acompanhe uma categoria na checklist",
      "category": "Tipos de evento, semana e feriados",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme que você está no Projeto e na versão corretos e que possui a edição quando a tarefa exigir gravação.<\/p><ol><li>Abra o Tipo de Evento.<\/li><li>Marque <strong>Acompanhar esta categoria na checklist deste Projeto<\/strong>.<\/li><li>Informe a quantidade esperada.<\/li><li>Escolha quando a regra será verificada.<\/li><li>Selecione <strong>Salvar tipo<\/strong>.<\/li><\/ol><p>Essa obrigação vale somente para a versão aberta.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "TIP-06",
      "title": "Inative ou exclua um tipo",
      "category": "Tipos de evento, semana e feriados",
      "audience": "Editor, Administrador e Superusuário; exclusão definitiva somente para Superusuário.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": false,
      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto ou o contexto administrativo correto antes de aplicar qualquer alteração.<\/p><p>Desmarque <strong>Ativo<\/strong> quando o tipo não deve mais ser usado em novos eventos. Para excluir, selecione <strong>Excluir<\/strong> e revise o impacto.<\/p><p>Um tipo relacionado a eventos não pode ser apagado sem tratar esses vínculos.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a confirmação e verifique se o item deixou de estar disponível como esperado antes de repetir a exclusão.<\/p>"
    },
    {
      "id": "DIA-01",
      "title": "Defina a semana letiva",
      "category": "Tipos de evento, semana e feriados",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> esta configuração é especialmente importante em Projetos acadêmicos. Abra a versão correta e confirme a edição.<\/p><ol><li>Abra <strong>Configurações → Dias letivos<\/strong>.<\/li><li>Leia a semana atualmente configurada antes de modificar as caixas de seleção.<\/li><li>Marque somente os dias da semana que normalmente contam como letivos dentro dos períodos letivos completos.<\/li><li>Não tente representar feriados ou reposições desmarcando dias da semana; esses casos são tratados pelas funções específicas de feriados e exceções.<\/li><li>Selecione <strong>Salvar parâmetros<\/strong> e aguarde a confirmação.<\/li><li>Volte à Mesa ou à Auditoria e confira se os totais de dias letivos foram recalculados de forma coerente.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> ao reabrir a tela, os mesmos dias devem continuar marcados e a contagem deve refletir a nova semana padrão.<\/p>"
    },
    {
      "id": "FER-01",
      "title": "Cadastre um feriado",
      "category": "Tipos de evento, semana e feriados",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme se o feriado já existe no cadastro para evitar duplicação.<\/p><ol><li>Abra <strong>Configurações → Feriados<\/strong>.<\/li><li>Procure pelo nome ou pela data antes de iniciar um novo cadastro.<\/li><li>Informe o nome oficial do feriado e escolha a abrangência adequada, como nacional, estadual ou municipal.<\/li><li>Defina se ele é <strong>fixo<\/strong> ou <strong>variável<\/strong>. Para feriado fixo, informe a data recorrente; para variável, a ocorrência anual poderá precisar ser informada separadamente.<\/li><li>Revise se a localidade e a natureza do feriado correspondem ao uso pretendido.<\/li><li>Salve e aguarde a confirmação antes de fechar a tela.<\/li><li>Quando o feriado afetar um calendário aberto, confira a Auditoria ou a contagem de dias para verificar o efeito esperado.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> o feriado deve aparecer uma única vez no cadastro com a abrangência e natureza corretas.<\/p>"
    },
    {
      "id": "FER-02",
      "title": "Informe a data de um feriado variável",
      "category": "Tipos de evento, semana e feriados",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme que você está no Projeto e na versão corretos e que possui a edição quando a tarefa exigir gravação.<\/p><ol><li>Abra <strong>Auditoria<\/strong>.<\/li><li>Localize o feriado variável pendente.<\/li><li>Use a ação para definir a data.<\/li><li>Informe a ocorrência daquele ano.<\/li><li>Salve.<\/li><\/ol><p>O cadastro do feriado continua o mesmo; a data anual é registrada separadamente.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "FER-03",
      "title": "Importe feriados nacionais",
      "category": "Tipos de evento, semana e feriados",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme que você está no Projeto e na versão corretos e que possui a edição quando a tarefa exigir gravação.<\/p><ol><li>Abra <strong>Configurações<\/strong> e <strong>Feriados<\/strong>.<\/li><li>Selecione <strong>Importar nacionais<\/strong>.<\/li><li>Aguarde a lista.<\/li><li>Marque somente os feriados desejados.<\/li><li>Confirme a importação.<\/li><\/ol><p>Feriados já cadastrados não devem ser duplicados.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "FER-04",
      "title": "Exclua um feriado",
      "category": "Tipos de evento, semana e feriados",
      "audience": "Superusuário com a edição do Projeto.",
      "roles": [
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme que você está no Projeto e na versão corretos e que possui a edição quando a tarefa exigir gravação.<\/p><ol><li>Abra o feriado.<\/li><li>Selecione <strong>Excluir definitivamente<\/strong>.<\/li><li>Revise as ocorrências relacionadas.<\/li><li>Confirme somente se deseja remover também os vínculos indicados.<\/li><\/ol><p>Se a intenção for apenas impedir novos usos, desmarque <strong>Ativo<\/strong>.<\/p><p>Use a exclusão definitiva somente quando o cadastro realmente não deve permanecer no sistema. Antes de confirmar, confira se o feriado possui ocorrências anuais ou referências em calendários. Quando a finalidade for apenas impedir uso futuro, prefira inativar o cadastro em vez de remover seu histórico.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a confirmação e verifique se o item deixou de estar disponível como esperado antes de repetir a exclusão.<\/p>"
    },
    {
      "id": "TEM-01",
      "title": "Crie ou personalize um Tema do Calendário",
      "category": "Temas",
      "audience": "Editor, Administrador e Superusuário conforme o acesso à configuração.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> abra o Projeto correto e observe qual item da lista está identificado como <strong>Em uso<\/strong>. Essa marca mostra o Tema aplicado ao calendário atual.<\/p><ol><li>Abra <strong>Configurações → Temas<\/strong> e selecione <strong>Novo tema<\/strong>, ou duplique um Tema existente para preservar o original.<\/li><li>Dê um nome que ajude a localizar a variação; o nome identifica o cadastro, mas não muda seu comportamento visual.<\/li><li>Preencha identidade institucional, logo, cabeçalho e rodapé.<\/li><li>Em <strong>Cores e eventos<\/strong>, ajuste as cores ou use <strong>Sugerir Cores<\/strong> para receber uma combinação automática. A sugestão apenas preenche cores; ela não cria nem salva outro Tema.<\/li><li>Ajuste composição, orientação, meses por página e apresentação dos eventos.<\/li><li>Observe a <strong>Prévia do tema<\/strong>, que permanece visível e deve reagir imediatamente às alterações.<\/li><li>Selecione <strong>Salvar tema<\/strong> e, quando desejar aplicá-lo ao calendário aberto, use <strong>Usar neste calendário<\/strong>.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> o Tema aplicado fica marcado como <strong>Em uso<\/strong>. Ele afeta o calendário, a Prévia e o PDF, mas nunca a Aparência pessoal da Mesa.<\/p>"
    },
    {
      "id": "TEM-02",
      "title": "Preencha a identidade institucional e o cabeçalho",
      "category": "Temas",
      "audience": "Editor, Administrador e Superusuário conforme o acesso à configuração.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto e o Tema do Calendário que está editando. Na seção <strong>Identidade institucional<\/strong>, informe o cabeçalho, o rodapé e, se desejar, o endereço do logo. Use uma imagem acessível ao navegador e acompanhe a <strong>Prévia do tema<\/strong> enquanto trabalha.<\/p><p>O cabeçalho não fica preso a uma altura rígida. A composição reserva uma altura mínima e aumenta o espaço quando o texto precisa de mais linhas. Por isso, acrescentar conteúdo pode reduzir a área vertical disponível para os meses e eventos da página. O campo de cabeçalho aceita até <strong>240 caracteres<\/strong>; use textos institucionais objetivos, principalmente em layouts com muitos meses por página.<\/p><p>O rodapé e o logo também devem ser conferidos em diferentes páginas da Prévia antes da publicação.<\/p><p><strong>Como conferir o resultado:<\/strong> verifique se todo o cabeçalho está legível, sem corte ou sobreposição, e se o crescimento não comprimiu excessivamente o corpo do calendário.<\/p>"
    },
    {
      "id": "TEM-03",
      "title": "Escolha ou sugira as cores do calendário",
      "category": "Temas",
      "audience": "Editor, Administrador e Superusuário conforme o acesso à configuração.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> abra o editor do Tema e mantenha a <strong>Prévia do tema<\/strong> visível. Em <strong>Cores e eventos<\/strong>, você pode ajustar manualmente cada cor ou selecionar <strong>Sugerir Cores<\/strong> para receber uma combinação automática pensada para ajudar quando não houver uma paleta definida.<\/p><p>A sugestão atualiza os campos e a Prévia imediatamente, mas não salva nada sozinha. Se não gostar, peça outra sugestão ou altere qualquer cor manualmente antes de usar <strong>Salvar tema<\/strong>. Para categorias específicas, use <strong>Adicionar tipo e cor<\/strong>; uma cor específica de Tipo de Evento prevalece sobre a cor geral da função visual correspondente.<\/p><p>Essas cores pertencem ao <strong>Tema do Calendário<\/strong> e serão usadas no produto, na Prévia e no PDF. Elas não alteram a <strong>Aparência da Mesa<\/strong>, que possui controle próprio na barra superior.<\/p><p><strong>Como conferir o resultado:<\/strong> compare eventos, texto, fundo, destaque e contraste na Prévia antes de salvar ou aplicar o Tema.<\/p>"
    },
    {
      "id": "TEM-04",
      "title": "Escolha a cor do fim de semana",
      "category": "Temas",
      "audience": "Editor, Administrador e Superusuário conforme o acesso à configuração.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto ou o contexto administrativo correto antes de aplicar qualquer alteração.<\/p><p>Para usar uma cor diferente em sábado e domingo, marque <strong>Usar uma cor própria nas colunas de sábado e domingo<\/strong> e escolha a cor.<\/p><p>Se a opção ficar desmarcada, essas colunas usarão a cor <strong>Fundo<\/strong>.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "TEM-05",
      "title": "Organize a página e os eventos",
      "category": "Temas",
      "audience": "Editor, Administrador e Superusuário conforme o acesso à configuração.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto ou o contexto administrativo correto antes de aplicar qualquer alteração.<\/p><p>Em <strong>Página e impressão<\/strong>, escolha fundo, composição, meses por página e orientação. Em <strong>Eventos nas células do calendário<\/strong>, escolha nomes, pontos coloridos ou nenhum conteúdo.<\/p><p>Defina também se os totais letivos serão mostrados e onde aparecerão.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "TEM-06",
      "title": "Confira e use o Tema",
      "category": "Temas",
      "audience": "Editor, Administrador e Superusuário com permissão para aplicar o Tema.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto, a versão e qual Tema aparece com a marca <strong>Em uso<\/strong>. A lista deve permitir reconhecer imediatamente o Tema aplicado, e o editor também indica quando o item aberto está em uso neste calendário.<\/p><ol><li>Abra o Tema que deseja conferir.<\/li><li>Revise a <strong>Prévia do tema<\/strong> enquanto percorre identidade, cores, eventos e página.<\/li><li>Se precisar de ajuda na combinação, use <strong>Sugerir Cores<\/strong> e ajuste o resultado antes de salvar.<\/li><li>Selecione <strong>Salvar tema<\/strong> para persistir as alterações do cadastro.<\/li><li>Use <strong>Usar neste calendário<\/strong> somente quando quiser tornar esse Tema o ativo do calendário aberto.<\/li><li>Abra <strong>Visualizar prévia<\/strong> para a conferência final do produto.<\/li><\/ol><p>Aplicar outro Tema exige uma versão que aceite essa alteração. A Aparência da Mesa é independente e não deve mudar com essa operação.<\/p><p><strong>Como conferir o resultado:<\/strong> volte à lista e confirme a marca <strong>Em uso<\/strong> no Tema escolhido; depois compare o calendário e a Prévia.<\/p>"
    },
    {
      "id": "TEM-07",
      "title": "Duplique ou exclua um Tema",
      "category": "Temas",
      "audience": "Editor, Administrador e Superusuário conforme a permissão.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto ou o contexto administrativo correto antes de aplicar qualquer alteração.<\/p><p>Use <strong>Duplicar<\/strong> para criar uma variação sem alterar o original. Para excluir, selecione <strong>Excluir<\/strong> e revise onde o Tema está sendo usado.<\/p><p>Os Temas iniciais são protegidos. Duplique um deles para personalizar.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "TEM-08",
      "title": "Diferencie Tema do Calendário e Aparência da Mesa",
      "category": "Temas",
      "audience": "qualquer pessoa com acesso à versão.",
      "roles": [
        "PUB",
        "COL",
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": false,
      "html": "<p>O sistema separa duas escolhas visuais com finalidades diferentes. O <strong>Tema do Calendário<\/strong> pertence ao produto que será trabalhado, conferido e entregue. Ele controla cores do calendário e dos eventos, fim de semana, textos institucionais, logo, cabeçalho, rodapé, orientação, organização da página e demais opções usadas na Prévia e no PDF. Um calendário pode possuir vários Temas, mas apenas um fica identificado como <strong>Em uso<\/strong> naquele momento.<\/p><p>A <strong>Aparência da Mesa<\/strong> pertence ao usuário. Ela modifica somente o ambiente de trabalho e pode ser alterada a qualquer momento pelo botão <strong>Aparência<\/strong> da faixa superior, inclusive entre versões Clara e Escura ou com <strong>Sugerir Cores<\/strong>. Essa preferência não é Tema do Calendário e não deve ser exportada como parte do produto.<\/p><p><strong>Como conferir:<\/strong> mudar a Aparência da Mesa deve alterar a interface sem modificar a Prévia/PDF; aplicar outro Tema deve mudar o calendário sem substituir a preferência pessoal da Mesa.<\/p>"
    },
    {
      "id": "PRO-01",
      "title": "Crie um Projeto",
      "category": "Projetos, versões e saídas",
      "audience": "Administrador e Superusuário.",
      "roles": [
        "ADM",
        "SUP"
      ],
      "requiresEdit": false,
      "html": "<ol><li>Abra <strong>Projetos e versões<\/strong> e entre na aba <strong>Projetos<\/strong>.<\/li><li>Confira a lista existente para evitar criar outro Projeto com a mesma finalidade.<\/li><li>Informe um nome suficientemente claro para distinguir a unidade, finalidade ou período quando necessário.<\/li><li>Escolha <strong>Acadêmico<\/strong> ou <strong>Administrativo<\/strong> conforme o tipo de validação que deverá orientar o Projeto.<\/li><li>Selecione <strong>Criar Projeto<\/strong> e aguarde a confirmação.<\/li><li>Abra o Projeto criado e confira a versão inicial antes de começar as configurações.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> o Projeto deve aparecer na lista e aceitar abertura normal. Se ele não aparecer, atualize a lista antes de repetir a criação para evitar duplicidade.<\/p>"
    },
    {
      "id": "PRO-02",
      "title": "Entenda Projetos e versões",
      "category": "Projetos, versões e saídas",
      "audience": "qualquer pessoa com acesso ao Projeto.",
      "roles": [
        "PUB",
        "COL",
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": false,
      "html": "<p><strong>Antes de começar:<\/strong> confira o Projeto, a versão ou a tela atual para não interpretar informações de outro contexto.<\/p><p>O Projeto reúne o histórico do mesmo calendário:<\/p><ul><li><strong>Rascunho:<\/strong> pode ser alterado;<\/li><li><strong>Finalizado:<\/strong> foi conferido e pode ser reaberto;<\/li><li><strong>Publicado:<\/strong> é a versão vigente e não pode ser alterada;<\/li><li><strong>Arquivado:<\/strong> é uma publicação anterior preservada.<\/li><\/ul><p><strong>Como conferir:<\/strong> use os indicadores e informações da própria tela para confirmar o estado atual. Se houver divergência, atualize a visualização antes de tomar uma decisão.<\/p>"
    },
    {
      "id": "PRO-03",
      "title": "Abra, renomeie ou importe uma versão",
      "category": "Projetos, versões e saídas",
      "audience": "Editor, Administrador e Superusuário.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": false,
      "html": "<p>Para abrir uma versão, entre em <strong>Projetos e versões<\/strong>, escolha o Projeto e selecione o item desejado. Em um Rascunho editável, o título pode ser alterado pelo cabeçalho e salvo normalmente.<\/p><p>Para continuar um calendário recebido de outra instalação, use <strong>Importar calendário<\/strong> e selecione o pacote `.calproj`. Durante leitura, análise e importação, acompanhe a barra e a descrição da etapa: a leitura local e as fases mensuráveis exibem percentual real; operações ainda opacas ao navegador usam barra animada, sem estimativas artificiais. Depois da leitura e validação inicial, escolha o destino. O rodapé apresenta somente a próxima ação válida: primeiro <strong>Analisar<\/strong>; durante o processamento, <strong>Analisando…<\/strong>; após uma análise aceita, o mesmo botão se transforma em <strong>Importar<\/strong>. Se o destino ou outra informação relevante mudar, a análise anterior é invalidada e o botão volta para <strong>Analisar<\/strong>.<\/p><p>A análise não grava dados. Ela mostra avisos, o destino e o plano de catálogos. Também valida as regras recebidas da Checklist antes de permitir a importação: operador de quantidade (`=`, `&gt;=`, `&lt;=`, `&gt;` ou `&lt;`), quantidade esperada, intervalo e referência ao Tipo de Evento precisam estar consistentes. Temas, Feriados e Tipos de Evento são comparados pelos <strong>parâmetros funcionais<\/strong>, não pelo nome ou código textual. Quando existe um cadastro local funcionalmente equivalente, o importador o reutiliza e preserva o nome local; quando não existe, cria o necessário. Usuários, permissões e dados administrativos da instalação de origem não são copiados.<\/p><p>A confirmação cria uma nova versão em <strong>Rascunho<\/strong>, sem substituir silenciosamente uma versão existente. Operadores como `=` são preservados como texto durante a gravação e não devem ser interpretados como fórmulas pela planilha. As permissões de importação continuam condicionadas ao papel e à participação no Projeto.<\/p><p><strong>Como conferir o resultado:<\/strong> leia a comunicação da própria modal durante todo o fluxo e, após a conclusão, abra a nova versão e revise avisos, configurações, eventos e Checklist antes de finalizar.<\/p>"
    },
    {
      "id": "PRO-04",
      "title": "Exclua um Projeto",
      "category": "Projetos, versões e saídas",
      "audience": "Administrador e Superusuário.",
      "roles": [
        "ADM",
        "SUP"
      ],
      "requiresEdit": false,
      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto ou o contexto administrativo correto antes de aplicar qualquer alteração.<\/p><ol><li>Abra <strong>Versões do projeto<\/strong>.<\/li><li>Se existir Agenda Pública, exclua-a primeiro na aba própria.<\/li><li>Selecione <strong>Excluir Projeto<\/strong>.<\/li><li>Revise todos os dados que serão removidos.<\/li><li>Digite exatamente o nome do Projeto.<\/li><li>Selecione <strong>Excluir definitivamente<\/strong>.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> aguarde a confirmação e verifique se o item deixou de estar disponível como esperado antes de repetir a exclusão.<\/p>"
    },
    {
      "id": "VER-01",
      "title": "Finalize o calendário",
      "category": "Projetos, versões e saídas",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> salve as alterações pendentes e abra a Auditoria/Checklist para reduzir pendências antes da conferência final.<\/p><ol><li>Na versão em Rascunho, selecione <strong>Finalizar<\/strong>.<\/li><li>Aguarde o sistema executar as validações; não feche a tela durante o processamento.<\/li><li>Leia o <strong>Relatório de conferência<\/strong> por grupos e identifique pendências bloqueantes, avisos e totais calculados.<\/li><li>Se houver bloqueio, feche o relatório, corrija o item indicado e execute a finalização novamente.<\/li><li>Se houver apenas informações que permitem prosseguir, leia o impacto antes de confirmar.<\/li><li>Confirme a finalização somente quando o conteúdo estiver pronto para deixar o estado de Rascunho.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> a versão passa para <strong>Finalizado<\/strong> e deixa de aceitar edição normal até ser reaberta para correção.<\/p>"
    },
    {
      "id": "VER-02",
      "title": "Leia o Relatório de conferência",
      "category": "Projetos, versões e saídas",
      "audience": "Colaborador, Editor, Administrador e Superusuário.",
      "roles": [
        "COL",
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": false,
      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto ou o contexto administrativo correto antes de aplicar qualquer alteração.<\/p><p>O relatório reúne pendências, avisos e totais. Comece pelos itens que impedem a finalização. Use <strong>Voltar ao calendário<\/strong> para corrigir.<\/p><p>Um aviso merece revisão, mas somente os bloqueios impedem a conclusão.<\/p><p><strong>Como conferir:<\/strong> use os indicadores e informações da própria tela para confirmar o estado atual. Se houver divergência, atualize a visualização antes de tomar uma decisão.<\/p>"
    },
    {
      "id": "VER-03",
      "title": "Reabra para corrigir",
      "category": "Projetos, versões e saídas",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme que você está no Projeto e na versão corretos e que possui a edição quando a tarefa exigir gravação.<\/p><p>Em uma versão Finalizada, selecione <strong>Reabrir para edição<\/strong>. A versão voltará a Rascunho.<\/p><p>Faça as correções e selecione <strong>Finalizar<\/strong> novamente antes de publicar.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "VER-04",
      "title": "Publique uma versão",
      "category": "Projetos, versões e saídas",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> a versão precisa estar <strong>Finalizada<\/strong> e o Relatório de conferência deve ter sido revisado.<\/p><ol><li>Abra <strong>Projetos e versões<\/strong> e confirme que está publicando a versão correta.<\/li><li>Selecione a ação <strong>Publicar<\/strong> disponível para a versão finalizada.<\/li><li>Quando houver opções adicionais, como motivo de retificação, leia o que será incluído na publicação antes de confirmar.<\/li><li>Confirme a publicação e aguarde o processamento terminar.<\/li><li>Não repita o comando enquanto a mensagem de progresso estiver ativa.<\/li><li>Após a conclusão, confira na lista de versões qual ficou marcada como <strong>Publicada<\/strong>.<\/li><li>Gere uma Prévia ou PDF se precisar validar a saída pública final.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> a nova publicação deve ficar identificada como vigente e a publicação anterior deve seguir a regra de arquivamento do sistema.<\/p>"
    },
    {
      "id": "VER-05",
      "title": "Retifique um calendário publicado",
      "category": "Projetos, versões e saídas",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme que você está no Projeto e na versão corretos e que possui a edição quando a tarefa exigir gravação.<\/p><ol><li>Selecione <strong>Retificar calendário<\/strong>.<\/li><li>Informe o motivo.<\/li><li>Selecione <strong>Criar retificação<\/strong>.<\/li><li>Aguarde a conferência da cópia.<\/li><\/ol><p>A publicação atual permanece intacta. A nova versão será aberta como Rascunho.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "VER-06",
      "title": "Publique uma retificação",
      "category": "Projetos, versões e saídas",
      "audience": "Editor, Administrador e Superusuário com a edição do Projeto.",
      "roles": [
        "EDT",
        "ADM",
        "SUP"

      "requiresEdit": true,
      "html": "<p><strong>Antes de começar:<\/strong> confirme que você está no Projeto e na versão corretos e que possui a edição quando a tarefa exigir gravação.<\/p><p>Finalize a nova versão e confira o relatório. Ao publicar, escolha se o motivo da retificação aparecerá no documento e selecione <strong>Publicar<\/strong>.<\/p><p>A publicação anterior será preservada como versão Arquivada.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "SAI-01",

      "requiresEdit": false,
      "html": "<p><strong>Antes de começar:<\/strong> confira o Projeto, a versão ou a tela atual para não interpretar informações de outro contexto.<\/p><p>Use <strong>Visualizar prévia<\/strong> e confira:<\/p><ul><li>título e identidade institucional;<\/li><li>períodos e eventos;<\/li><li>cores e conteúdo das células;<\/li><li>totais letivos;<\/li><li>orientação e composição da página.<\/li><\/ul><p>Feche a Prévia e ajuste o Tema se algo estiver incorreto.<\/p><p><strong>Como conferir:<\/strong> use os indicadores e informações da própria tela para confirmar o estado atual. Se houver divergência, atualize a visualização antes de tomar uma decisão.<\/p>"
    },
    {
      "id": "SAI-02",
      "title": "Gere o PDF",
      "category": "Projetos, versões e saídas",

      "roles": [

        "EDT",
        "ADM",
        "SUP"
      ],
      "requiresEdit": false,
      "html": "<ol><li>Abra <strong>Visualizar prévia<\/strong> e confira o calendário antes de gerar o arquivo.<\/li><li>Revise cabeçalho, logo, rodapé, cores, orientação, quantidade de meses por página e conteúdo das células.<\/li><li>Se houver corte, sobreposição ou divergência de Tema, corrija a configuração antes de continuar.<\/li><li>Selecione <strong>Gerar PDF<\/strong> e acompanhe a barra e a etapa informada até o navegador disponibilizar o arquivo. O sistema só apresenta porcentagem quando ela corresponde a progresso efetivamente medido.<\/li><li>Abra o PDF gerado e confira pelo menos a primeira página, uma página intermediária e a última.<\/li><li>Verifique se os eventos importantes e os totais esperados aparecem no documento.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> o PDF deve representar o mesmo conteúdo e Tema conferidos na Prévia, sem cortar informações relevantes.<\/p>"
    },
    {
      "id": "EQU-01",

        "EDT",

      ],
      "requiresEdit": false,
      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto ou o contexto administrativo correto antes de aplicar qualquer alteração.<\/p><ol><li>Abra <strong>Projetos e versões<\/strong> e <strong>Equipe do Projeto<\/strong>.<\/li><li>Informe o e-mail.<\/li><li>Informe o nome se for uma pessoa nova.<\/li><li>Escolha <strong>Colaborador<\/strong> ou <strong>Editor<\/strong>.<\/li><li>Selecione <strong>Adicionar à equipe<\/strong>.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "EQU-02",

      "category": "Projetos, versões e saídas",

      ],
      "requiresEdit": false,
      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto ou o contexto administrativo correto antes de aplicar qualquer alteração.<\/p><p>Na lista da equipe, escolha o novo papel ou remova a pessoa. A remoção retira apenas o acesso ao Projeto; o cadastro global continua ativo.<\/p><p>O criador do Projeto não pode ser removido da própria equipe.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "USU-01",
      "title": "Cadastre ou altere um usuário",
      "category": "Projetos, versões e saídas",
      "audience": "Administrador e Superusuário.",
      "roles": [
        "ADM",
        "SUP"
      ],
      "requiresEdit": false,
      "html": "<p><strong>Antes de começar:<\/strong> esta função é administrativa. Confirme se a pessoa já possui cadastro antes de criar outro registro para o mesmo e-mail.<\/p><ol><li>Abra <strong>Configurações → Usuários e acessos<\/strong>.<\/li><li>Procure o usuário pelo nome ou e-mail.<\/li><li>Para um novo cadastro, informe nome e e-mail corretamente; para um cadastro existente, abra o registro correspondente.<\/li><li>Escolha o perfil global adequado e defina o status de acesso.<\/li><li>Revise com atenção alterações que concedam ou removam privilégios administrativos.<\/li><li>Se o sistema exigir confirmação de segurança para mudança de Superusuário, conclua esse passo antes de salvar.<\/li><li>Salve e confira o registro novamente na lista.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> o usuário deve aparecer uma única vez, com e-mail, perfil e status corretos. O papel dentro de Projetos é administrado separadamente.<\/p>"
    },
    {
      "id": "USU-02",
      "title": "Confirme uma alteração de Superusuário",
      "category": "Projetos, versões e saídas",
      "audience": "Superusuário.",
      "roles": [
        "SUP"
      ],
      "requiresEdit": false,
      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto ou o contexto administrativo correto antes de aplicar qualquer alteração.<\/p><p>Quando o sistema solicitar confirmação:<\/p><ol><li>selecione <strong>Enviar código<\/strong>;<\/li><li>consulte o e-mail do Superusuário alterado;<\/li><li>informe os seis números;<\/li><li>selecione <strong>Salvar usuário<\/strong> novamente.<\/li><\/ol><p>O código expira em cinco minutos.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
    },
    {
      "id": "COL-01",
      "title": "Envie uma sugestão",
      "category": "Projetos, versões e saídas",
      "audience": "Colaborador ou pessoa sem a edição do Projeto.",
      "roles": [
        "COL"
      ],
      "requiresEdit": false,
      "html": "<ol><li>Abra o Projeto e localize a ação <strong>Enviar sugestão<\/strong>.<\/li><li>Escolha se a proposta pretende adicionar, alterar ou remover informação.<\/li><li>Quando houver um evento-alvo, confira título e datas para ter certeza de que a sugestão está ligada ao registro correto.<\/li><li>Descreva objetivamente a mudança proposta e informe uma justificativa que permita ao Editor compreender o motivo.<\/li><li>Revise o conteúdo antes de enviar; a sugestão não altera o calendário imediatamente.<\/li><li>Selecione <strong>Enviar<\/strong> e aguarde a confirmação.<\/li><li>Use a lista de sugestões para acompanhar a situação ou cancelar enquanto a regra permitir.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> a sugestão deve aparecer na lista com o estado inicial correspondente e aguardar análise de quem possui permissão para decidir.<\/p>"
    },
    {
      "id": "COL-02",

      "requiresEdit": false,
      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto ou o contexto administrativo correto antes de aplicar qualquer alteração.<\/p><p>Uma publicação não pode ser alterada diretamente. Você pode recusar a sugestão ou selecionar <strong>Criar ou abrir retificação<\/strong>.<\/p><p>Somente na retificação correta será possível aceitar e incorporar a proposta.<\/p><p>Antes de decidir, abra a sugestão e confirme qual publicação ela menciona. Se a proposta ainda for válida, use <strong>Criar ou abrir retificação<\/strong>, abra a nova versão em Rascunho e só então volte à sugestão para avaliá-la. Não tente alterar diretamente a versão Publicada.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"

      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto ou o contexto administrativo correto antes de aplicar qualquer alteração.<\/p><p>A contagem depende dos períodos completos, da semana padrão, dos feriados, dos eventos que alteram a contagem e dos dias excepcionais.<\/p><p>Se o total estiver incorreto, revise esses itens antes de alterar a meta.<\/p><p>Abra o detalhamento de dias letivos e compare o período que está sendo contado com a semana letiva padrão. Em seguida confira feriados, exceções e eventos que adicionam ou retiram dias. Faça a correção na origem do cálculo; alterar apenas a meta pode esconder o problema sem corrigi-lo.<\/p><p><strong>Como conferir:<\/strong> use os indicadores e informações da própria tela para confirmar o estado atual. Se houver divergência, atualize a visualização antes de tomar uma decisão.<\/p>"

      "html": "<p><strong>Antes de começar:<\/strong> a Agenda Pública é opcional. Confirme que o recurso está ativado e que a versão correta já pode ser publicada na integração.<\/p><ol><li>Abra <strong>Projetos e versões → Agenda Pública<\/strong> no Projeto desejado.<\/li><li>Confira o nome e as configurações atualmente associadas ao Projeto.<\/li><li>Na primeira utilização, selecione <strong>Criar Agenda Pública<\/strong>; se já houver uma Agenda vinculada, use <strong>Atualizar Agenda Pública<\/strong>.<\/li><li>Leia qualquer diagnóstico apresentado antes de repetir uma criação, para não produzir agendas duplicadas.<\/li><li>Aguarde a sincronização terminar e confira o resumo retornado pelo sistema.<\/li><li>Abra a Agenda resultante quando o link estiver disponível e compare algumas datas com a versão publicada.<\/li><\/ol><p><strong>Como conferir o resultado:<\/strong> o Projeto deve continuar associado à mesma Agenda Pública e refletir a publicação vigente.<\/p>"

      "html": "<p><strong>Antes de começar:<\/strong> confirme o Projeto ou o contexto administrativo correto antes de aplicar qualquer alteração.<\/p><p>Selecione <strong>Ativar Agenda Pública<\/strong> e siga as sete etapas mostradas na tela. O assistente orienta a criar o projeto Google Cloud, registrar o <strong>Número do projeto<\/strong>, associá-lo ao Apps Script, ativar as APIs, liberar o acesso da Google Apps Script API à conta, tratar autorização de teste quando necessária e criar a implantação como <strong>App da Web<\/strong>.<\/p><p>Na etapa final, escolha <strong>Conferir e concluir<\/strong>. O número do projeto registrado pelo usuário é autoritativo: mensagens técnicas do Google podem indicar outro projeto para diagnóstico, mas o sistema nunca substitui esse número automaticamente. Se houver divergência, volte à etapa de associação do Apps Script e corrija o projeto.<\/p><p>Se precisar parar, use <strong>Fazer depois / Fechar<\/strong>. O calendário, a Prévia e o PDF continuarão funcionando.<\/p><p><strong>Como conferir o resultado:<\/strong> aguarde a mensagem de confirmação e revise a própria tela antes de iniciar outra operação. Se o resultado não aparecer, atualize os dados antes de repetir a ação.<\/p>"
